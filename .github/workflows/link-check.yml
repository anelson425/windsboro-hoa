# Weekly check for broken links on the built site.
# Opens a GitHub issue (or comments on the open one) when links break.
name: Check links

on:
  schedule:
    # Mondays at 14:00 UTC (8/9 AM Central)
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build with Hugo
        run: hugo --minify
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # windsboro.swimtopia.com is behind a Cloudflare bot challenge and always returns 403 to checkers
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/public
            --index-files index.html
            --exclude-path public/404.html
            --exclude windsboro\.swimtopia\.com
            --max-retries 3
            'public/**/*.html'
          output: ${{ runner.temp }}/lychee-report.md
          fail: false
      - name: Open or update issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/lychee-report.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '\n\n[Workflow run](%s)\n' "$RUN_URL" >> "$REPORT"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Broken links found in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$REPORT"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Broken links found" --body-file "$REPORT"
          fi
