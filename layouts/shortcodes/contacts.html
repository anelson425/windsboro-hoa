{{ $data_file := index .Site.Data .Params.file_name }}
{{ $data := index $data_file .Params.contact_type }}

<div class="contact-group">
    {{ range $data }}
    <p>
        <strong>{{ .title }}</strong>
        {{ if .name }}{{ .name }}{{ end }}
        {{ if .email }}<br /><a href="mailto:{{ .email }}">{{ .email }}</a>{{ end }}
        {{ if .phone }}<br />{{ .phone }}{{ end }}
    </p>
    {{ end }}
</div>
